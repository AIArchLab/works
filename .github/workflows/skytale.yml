name: skytale

on:
  push:
    paths:
      - "skytale/**"
      - ".github/workflows/skytale.yml"
  pull_request:
    paths:
      - "skytale/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skytale
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Gate the example generation
        run: python -m skytale.cli check --dir examples/demo
