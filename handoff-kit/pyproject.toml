[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-kit"
version = "0.1.0"
description = "Fail-closed session handoff for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AIArchLab" },
]
keywords = ["llm", "agents", "handoff", "context", "session"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
handoff-kit = "handoff_kit.cli:main"

[tool.setuptools]
packages = ["handoff_kit"]
