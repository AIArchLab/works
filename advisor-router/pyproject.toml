[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advisor-router"
version = "0.1.0"
description = "A model advisor that returns only a model name (sample / concept)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "pyyaml>=6,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
advisor-router = "advisor.cli:main"

[tool.setuptools]
packages = ["advisor"]

[tool.setuptools.package-data]
advisor = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
